name: Quality
on: [push, pull_request]
jobs:
  ready:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.8.2
      - run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @clankerauth/web exec playwright install --with-deps chromium
      - run: pnpm ready
      - run: pnpm --filter @clankerauth/server deploy --prod /tmp/clankerauth-production
      - run: pnpm test:package /tmp/clankerauth-production
