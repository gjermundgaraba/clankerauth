name: Quality
on: [push, pull_request]
jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - run: npm install -g pnpm@12.3.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm ready
      - run: pnpm --filter @clankerauth/server deploy --prod /tmp/clankerauth-production
      - run: pnpm test:package /tmp/clankerauth-production
