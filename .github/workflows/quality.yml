name: Quality
on: [push, pull_request]
jobs:
  ready:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install -g "pnpm@$(node -p "require('./package.json').devEngines.packageManager.version")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @clankerauth/web exec playwright install --with-deps chromium
      - run: pnpm ready
      - run: pnpm --filter @clankerauth/server deploy --prod /tmp/clankerauth-production
      - run: pnpm test:package /tmp/clankerauth-production
