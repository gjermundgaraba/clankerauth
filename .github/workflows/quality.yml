name: Quality
on: [push, pull_request]
jobs:
  ready:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.7.0
      - run: npm install -g pnpm@12.3.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @clankerauth/web exec playwright install --with-deps chromium
      - run: pnpm ready
      - run: pnpm --filter @clankerauth/server deploy --prod /tmp/clankerauth-production
      - run: pnpm test:package /tmp/clankerauth-production
