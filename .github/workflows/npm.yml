name: Publish npm package

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.7.0
          registry-url: https://npm.pkg.github.com
      - name: Check that the tag matches both package versions
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./packages/node/package.json').version")"
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./packages/dev/package.json').version")"
      - run: npm install -g pnpm@12.3.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @clankerauth/web exec playwright install --with-deps chromium
      - run: pnpm ready
      # pnpm resolves the workspace catalog protocol in the published manifest; npm would not.
      - run: pnpm publish --no-git-checks
        working-directory: packages/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm publish --no-git-checks
        working-directory: packages/dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
