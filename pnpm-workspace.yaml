packages:
  - apps/*
  - packages/*

catalogMode: prefer
catalog:
  "@effect/platform-node": 4.0.0-rc.112
  "@better-auth/oauth-provider": 1.7.3
  better-auth: 1.7.3
  better-sqlite3: 12.11.1
  effect: 4.0.0-rc.112
  "@types/better-sqlite3": 9.6.0
  "@types/node": 26.5.0
  jose: 6.2.12
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vite-plus: 0.3.1

overrides:
