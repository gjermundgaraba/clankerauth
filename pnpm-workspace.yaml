packages:
  - apps/*
  - packages/*

catalogMode: prefer
saveExact: true
catalog:
  "@effect/platform-browser": 4.1.2
  "@effect/platform-node": 4.1.2
  # The CLI depends on it directly, at effect's version, for npm installs: platform-node takes
  # it by caret, and a newer one requires a newer effect, so npm would install a second effect
  # under it. Keep it equal to effect.
  "@effect/platform-node-shared": 4.1.2
  "@effect/vitest": 4.1.2
  foldkit: 0.170.0
  "@foldkit/ui": 0.170.0
  "@foldkit/vite-plugin": 0.29.0
  "@foldkit/oxlint-plugin": 0.15.4
  happy-dom: 21.0.4
  "@better-auth/oauth-provider": 1.7.14
  "@better-auth/api-key": 1.7.14
  better-auth: 1.7.14
  better-call: 1.4.4
  effect: 4.1.2
  "@types/node": 26.6.6
  jose: 6.2.14
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
  playwright: 1.64.1
  kysely: 0.29.7
  "@better-auth/cimd": 1.7.14
  "@better-auth/core": 1.7.14
  "@better-auth/kysely-adapter": 1.7.14
  "@modelcontextprotocol/client": 2.4.0
  "@opentelemetry/api": 1.10.0
  "@oxlint/plugins": 1.89.0
  "@gjermundgaraba/effect-actions": 0.29.0
  "@gjermundgaraba/components": 0.7.0
  oauth4webapi: 3.8.8
  proper-lockfile: 4.1.2
  "@types/proper-lockfile": 4.1.4
  vitest: 5.1.0
  ultracite: 8.1.1
  "@effect/tsgo": 0.67.3
  "@clanker-stuff/oxlint-config": 0.5.0
overrides:
  vite@*: "catalog:"
  kysely: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowedVersions:
    vite: "*"
    vitest: "*"
  allowAny:
    - vite
    - vitest
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - "@gjermundgaraba/*"
  - effect
  - "@effect/*"
  - "@clanker-stuff/*"
permissions:
  ultracite:
    skills: true
# Name the directories pnpm links Ultracite's skill into: without one it auto-detects an agent,
# and where none is installed, as in the Docker build, the install fails.
skills:
  dirs:
    - .agents/skills
    - .claude/skills
