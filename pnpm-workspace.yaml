packages:
  - apps/*
  - packages/*

catalogMode: prefer
catalog:
  "@effect/platform-node": 4.0.0-rc.116
  "@better-auth/oauth-provider": 1.7.5
  "@better-auth/api-key": 1.7.5
  better-auth: 1.7.5
  better-call: 1.4.0
  effect: 4.0.0-rc.116
  "@types/node": 26.6.2
  jose: 6.2.12
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vite-plus: 0.3.3
  playwright: 1.63.0
  kysely: 0.29.6
  "@better-auth/cimd": 1.7.5
  "@better-auth/core": 1.7.5
  "@better-auth/kysely-adapter": 1.7.5
  "@opentelemetry/api": 1.9.1
  "@oxlint/plugins": 1.82.0
  "@gjermundgaraba/effect-actions": 0.5.0

overrides:
  vite@*: "catalog:"
  kysely: "catalog:"
peerDependencyRules:
  allowedVersions:
    vite: "*"
  allowAny:
    - vite
# Registry releases wait one day unless explicitly approved below.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@0.3.2"
  - "@voidzero-dev/vite-plus-darwin-arm64@0.3.2"
  - "@voidzero-dev/vite-plus-darwin-x64@0.3.2"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@0.3.2"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@0.3.2"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@0.3.2"
  - "@voidzero-dev/vite-plus-linux-x64-musl@0.3.2"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@0.3.2"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@0.3.2"
  - vite-plus
  - "@gjermundgaraba/effect-actions@0.5.0"
  - "@effect/platform-node-shared@4.0.0-rc.116"
  - "@effect/platform-node@4.0.0-rc.116"
  - effect@4.0.0-rc.116
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - "@types/node@26.6.2"
