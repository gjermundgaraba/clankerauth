packages:
  - apps/*
  - packages/*

catalogMode: prefer
catalog:
  "@effect/platform-node": 4.0.0
  "@better-auth/oauth-provider": 1.7.5
  "@better-auth/api-key": 1.7.5
  better-auth: 1.7.5
  better-call: 1.4.0
  effect: 4.0.0
  "@types/node": 26.6.2
  jose: 6.2.12
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  playwright: 1.63.0
  kysely: 0.29.6
  "@better-auth/cimd": 1.7.5
  "@better-auth/core": 1.7.5
  "@better-auth/kysely-adapter": 1.7.5
  "@opentelemetry/api": 1.9.1
  "@oxlint/plugins": 1.82.0
  "@gjermundgaraba/effect-actions": 0.9.0

overrides:
  vite@*: "catalog:"
  kysely: "catalog:"
peerDependencyRules:
  allowedVersions:
    vite: "*"
  allowAny:
    - vite
# Registry releases wait one day unless explicitly approved below.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - vite-plus
  - "@gjermundgaraba/effect-actions"
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
